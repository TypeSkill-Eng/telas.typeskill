        <!-- Cartão do código de verificação -->
        <section class="cartao codigo-cartao" aria-labelledby="titulo-codigo">

            <img class="codigo-logo" src="LOGO TypeSkill.png" alt="Logo TypeSkill">

            <h1 id="titulo-codigo">Código</h1>

            <p class="cartao__sub" id="descricao-codigo">
                Insira o código enviado ao seu endereço de email.
            </p>
            <p class="codigo-email">(<span id="email-destino">seu email</span>)</p>

            <form class="cartao__form" id="form-codigo" novalidate aria-describedby="descricao-codigo">
                <fieldset class="codigo-grupo">
                    <legend class="so-leitor">Código de verificação de 4 dígitos</legend>
                    <div class="codigo-campos">
                        <input class="codigo-campo" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Dígito 1 de 4">
                        <input class="codigo-campo" type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 2 de 4">
                        <input class="codigo-campo" type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 3 de 4">
                        <input class="codigo-campo" type="text" inputmode="numeric" autocomplete="off" aria-label="Dígito 4 de 4">
                    </div>
                </fieldset>

                <p class="codigo-mensagem" id="mensagem-codigo" role="status" aria-live="polite"></p>

                <button type="submit" class="botao botao--cheio cartao__botao">
                    Enviar Código
                </button>
            </form>

        </section>
    </main>

    <script>
    (function () {
        "use strict";

        var form = document.getElementById("form-codigo");
        var grupo = form.querySelector(".codigo-campos");
        var campos = Array.prototype.slice.call(form.querySelectorAll(".codigo-campo"));
        var mensagem = document.getElementById("mensagem-codigo");
        var botao = form.querySelector("button[type='submit']");
        var emailDestino = document.getElementById("email-destino");
        var total = campos.length;

        /* ---------- E-mail mostrado no texto ----------
           A tela anterior pode mandar o e-mail de duas formas:
           codigo.html?email=fulano@gmail.com
           ou  sessionStorage.setItem("emailRecuperacao", "fulano@gmail.com") */
        function lerEmail() {
            var email = new URLSearchParams(window.location.search).get("email");
            if (!email) {
                try { email = sessionStorage.getItem("emailRecuperacao"); } catch (e) { /* sem acesso */ }
            }
            return email || "";
        }

        function mascararEmail(email) {
            var partes = email.split("@");
            if (partes.length !== 2 || !partes[0] || !partes[1]) return "";
            return partes[0].slice(0, 2) + "***@" + partes[1];
        }

        emailDestino.textContent = mascararEmail(lerEmail()) || "seu email";

        /* ---------- Ajudantes ---------- */
        function mostrar(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.setAttribute("data-tipo", tipo || "");
        }

        function limparErro() {
            grupo.classList.remove("is-erro");
            campos.forEach(function (c) { c.removeAttribute("aria-invalid"); });
        }

        function marcar(campo) {
            campo.classList.toggle("is-preenchido", campo.value !== "");
        }

        /* Distribui os dígitos a partir do campo "inicio" (usado ao colar ou no preenchimento automático) */
        function preencher(inicio, texto) {
            var digitos = texto.replace(/\D/g, "").slice(0, total - inicio);
            digitos.split("").forEach(function (d, i) {
                campos[inicio + i].value = d;
                marcar(campos[inicio + i]);
            });
            campos[Math.min(inicio + digitos.length, total - 1)].focus();
        }

        /* ---------- Comportamento de cada campo ---------- */
        campos.forEach(function (campo, i) {

            campo.addEventListener("focus", function () { campo.select(); });

            campo.addEventListener("keydown", function (e) {
                if (e.ctrlKey || e.metaKey || e.altKey) return;

                if (e.key === "Backspace") {
                    if (campo.value === "" && i > 0) {          /* campo vazio: volta e apaga o anterior */
                        e.preventDefault();
                        campos[i - 1].value = "";
                        marcar(campos[i - 1]);
                        campos[i - 1].focus();
                    }
                } else if (e.key === "ArrowLeft" && i > 0) {
                    e.preventDefault();
                    campos[i - 1].focus();
                } else if (e.key === "ArrowRight" && i < total - 1) {
                    e.preventDefault();
                    campos[i + 1].focus();
                } else if (e.key.length === 1 && !/\d/.test(e.key)) {
                    e.preventDefault();                          /* só aceita números */
                }
            });

            campo.addEventListener("input", function (e) {
                limparErro();
                mostrar("");

                /* digitou um número: fica só ele e passa para o próximo campo */
                if (e.data && e.data.length === 1 && /\d/.test(e.data)) {
                    campo.value = e.data;
                    marcar(campo);
                    if (i < total - 1) campos[i + 1].focus();
                    return;
                }

                /* preenchimento automático (vários dígitos de uma vez) ou apagou */
                var digitos = campo.value.replace(/\D/g, "");
                campo.value = "";
                if (digitos) { preencher(i, digitos); } else { marcar(campo); }
            });

            campo.addEventListener("paste", function (e) {
                e.preventDefault();
                var texto = (e.clipboardData || window.clipboardData).getData("text");
                limparErro();
                mostrar("");
                preencher(i, texto);
            });
        });

        function verificarCodigo(codigo) {
            return new Promise(function (resolve) { setTimeout(resolve, 400); });
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            var codigo = campos.map(function (c) { return c.value; }).join("");

            if (codigo.length < total) {
                grupo.classList.add("is-erro");
                campos.forEach(function (c) { if (!c.value) c.setAttribute("aria-invalid", "true"); });
                mostrar("Digite os " + total + " números do código.", "erro");
                campos.filter(function (c) { return !c.value; })[0].focus();
                return;
            }

            botao.disabled = true;
            mostrar("Verificando...", "");

            verificarCodigo(codigo)
                .then(function () {
                    mostrar("Código recebido (demonstração). A verificação real depende da integração com o backend.", "ok");
                })
                .catch(function (erro) {
                    grupo.classList.add("is-erro");
                    mostrar(erro.message || "Código inválido.", "erro");
                    campos[0].focus();
                })
                .then(function () { botao.disabled = false; });
        });
    })();
    </script>
</body>
</html>
